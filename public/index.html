<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolyStrike — Arena</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud" class="hidden">
        <div class="brand">POLY<span>STRIKE</span><small>PROTOTYP ONLINE</small></div>
        <div id="scoreboard"></div>
        <div id="reticle">+</div>
        <div id="health">100</div>
        <div id="weapon">PISTOLET<br /><small>LPM — STRZAŁ</small></div>
        <div id="feed"></div>
      </div>
      <main id="menu">
        <section class="panel">
          <p class="eyebrow">LOW-POLY MULTIPLAYER FPS</p>
          <h1>POLY<span>STRIKE</span></h1>
          <p class="intro">Wejdź na arenę, pokonaj boty i innych graczy. Pierwszy do 15 eliminacji wygrywa.</p>
          <label for="name">NAZWA GRACZA</label>
          <input id="name" maxlength="16" value="Gracz" autocomplete="nickname" />
          <button id="play">SZYBKA ROZGRYWKA</button>
          <p class="controls">WASD — ruch · Shift — sprint · Mysz — celowanie · LPM — strzał</p>
        </section>
      </main>
      <section id="result" class="overlay hidden">
        <p id="result-label">VICTORY</p>
        <button id="again">ZAGRAJ JESZCZE RAZ</button>
      </section>
      <div id="hint">Kliknij ekran, aby przejąć sterowanie myszą</div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
